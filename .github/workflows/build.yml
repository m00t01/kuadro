name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
  # One draft release per version, created before the builds so Windows and Mac upload into the same one.
  draft:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          # Remove leftover drafts for this version (published releases are never touched).
          gh api "repos/${{ github.repository }}/releases?per_page=50" --jq ".[] | select(.draft and .tag_name == \"v$V\") | .id" | while read id; do gh api -X DELETE "repos/${{ github.repository }}/releases/$id"; done
          if gh api "repos/${{ github.repository }}/releases/tags/v$V" >/dev/null 2>&1; then echo "v$V is already published"; exit 1; fi
          gh api -X POST "repos/${{ github.repository }}/releases" -f tag_name="v$V" -f target_commitish="${{ github.sha }}" -f name="$V" -F draft=true >/dev/null
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: draft
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Build and publish
        run: npm run ${{ matrix.os == 'macos-latest' && 'dist:mac' || 'dist:win' }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
